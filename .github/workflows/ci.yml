name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check bdbackup tests scripts

      - name: Run tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, percona, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install .
      - name: Run disposable database recovery tests
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          case "$ENGINE" in
            mysql)
              docker pull mysql:8.4
              python scripts/integration_mysql.py
              ;;
            percona)
              docker pull percona/percona-server:8.4
              docker pull percona/percona-xtrabackup:8.4
              python scripts/integration_physical.py percona
              ;;
            mariadb)
              docker pull mariadb:11.4
              python scripts/integration_physical.py mariadb
              ;;
          esac

  build:
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package
        run: twine check dist/*

      - name: Test installed wheel outside the source tree
        run: python scripts/smoke_install.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
